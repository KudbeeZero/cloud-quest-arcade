<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Cloud Quest Arcade</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        background: #0a0a0f;
        color: #e5e5e5;
        text-align: center;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        padding: 2rem;
        background: linear-gradient(
          135deg,
          rgba(38, 38, 45, 0.8),
          rgba(10, 10, 15, 0.8)
        );
      }
      .badge {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: #67e8f9;
      }
      h1 {
        margin: 0.75rem 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 900;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.9rem;
        color: #d4d4d4;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        text-decoration: none;
        border-radius: 0.75rem;
        padding: 0.75rem 1.5rem;
        font-weight: 700;
        color: #0a0a0f;
        background: linear-gradient(90deg, #22d3ee, #8b5cf6);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="badge">Cloud Quest Arcade</p>
      <h1>You're offline</h1>
      <p>
        The arcade can't reach the network right now. Your progress is saved
        locally — reconnect to jump back into your training missions.
      </p>
      <a href="/">► Return to Arcade</a>
    </main>
  </body>
</html>
