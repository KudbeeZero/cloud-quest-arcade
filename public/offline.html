<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Cloud Quest Arcade</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #171717;
        color: #f5f5f5;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 28rem;
      }
      .badge {
        display: inline-block;
        padding: 0.35rem 0.9rem;
        border-radius: 9999px;
        background: #0e7490;
        color: #ecfeff;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.6rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: #d4d4d4;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        border: none;
        border-radius: 0.5rem;
        padding: 0.7rem 1.4rem;
        background: #22d3ee;
        color: #082f49;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Cloud Quest Arcade</span>
      <h1>You're offline</h1>
      <p>
        It looks like your connection dropped. If you've played before, your
        progress and cached quiz are still available — reconnect to sync and
        grab the latest questions.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
