<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Cloud Quest Arcade</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: linear-gradient(160deg, #0b0f1a, #1a0c2e);
        color: #e5e7eb;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        padding: 32px;
        border: 2px solid #22d3ee;
        border-radius: 16px;
        box-shadow: 0 0 24px rgba(34, 211, 238, 0.25);
      }
      h1 { color: #4ade80; letter-spacing: 0.15em; text-transform: uppercase; }
      p { color: #9ca3af; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 20px;
        border-radius: 8px;
        background: #f472b6;
        color: #0b0f1a;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline</h1>
      <p>
        You're off the grid, cadet. Reconnect to the network to resume your
        AWS Cloud Practitioner training at Cloud Quest Arcade.
      </p>
      <a href="/">Return to Arcade</a>
    </div>
  </body>
</html>
